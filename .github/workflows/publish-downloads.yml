name: Publish downloads

# The repository is private, so the website and the launcher's update check cannot read its
# releases. When a release is published, its installers are copied to a public Cloudflare R2
# bucket and a latest.json is written next to them:
#
#   https://downloads.theminesa.studio/launcher/<version>/<installer>
#   https://downloads.theminesa.studio/launcher/latest.json
#   https://downloads.theminesa.studio/launcher/updater.json
#
# latest.json copies the shape of GitHub's releases/latest answer, so both readers only need
# the other URL (src-tauri/src/update.rs, and dungeon-blitz-r.js on the website). updater.json is
# the tauri-plugin-updater manifest: one signed installer per platform key, which lets the
# launcher download and apply its own update in place (Windows NSIS and Linux AppImage).
#
# One-time setup (Cloudflare dashboard, then repo Settings > Secrets and variables > Actions):
#   1. R2 > create a bucket. Settings > Custom Domains > add downloads.theminesa.studio.
#   2. Bucket CORS policy: allow GET from https://theminesa.studio (the page reads latest.json).
#   3. R2 > Manage API tokens > create a token with Object Read & Write on that bucket.
#   4. Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
#      Variable: R2_BUCKET (the bucket's name).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to (re)publish, e.g. v1.12.0"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-downloads
  cancel-in-progress: false

env:
  PUBLIC_URL: https://downloads.theminesa.studio
  SITE_PAGE: https://theminesa.studio/dungeon-blitz-r.html

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > meta.json
          if [ "$(jq '.isDraft or .isPrerelease' meta.json)" = "true" ]; then
            echo "$TAG is a draft or prerelease; nothing to publish."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          mkdir dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl --pattern 'DungeonBlitzR-Launcher-*'
          # The old Electron releases share this repository; only the Rust launcher's installers
          # are mirrored.
          if ! ls dl/*-win-x64-setup.exe >/dev/null 2>&1; then
            echo "$TAG has no Rust launcher installers; skipping."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          ls -la dl
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload to R2
        if: env.SKIP != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Installers first, latest.json last: the pointer never names a file that is not there.
          aws s3 cp dl "s3://$BUCKET/launcher/$version/" --recursive --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"
          jq -n --arg tag "$TAG" --arg base "$PUBLIC_URL/launcher/$version" --arg page "$SITE_PAGE" \
            --argjson files "$(cd dl && ls -1 | jq -R '{name: .}' | jq -s .)" \
            '{tag_name: $tag, draft: false, prerelease: false, html_url: $page,
              assets: ($files | map({name, browser_download_url: ($base + "/" + .name)}))}' > latest.json
          cat latest.json
          aws s3 cp latest.json "s3://$BUCKET/launcher/latest.json" --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=300"

      - name: Write the updater manifest
        if: env.SKIP != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          # tauri-plugin-updater reads this file (src-tauri/tauri.conf.json endpoints). Each entry
          # is a platform key (update.rs updater_target()) -> the signed installer the launcher
          # downloads and installs over itself. Only the self-updating builds appear; the .dmg and
          # .deb are download-only. signature is the .sig file's content, made in rust-launcher.yml.
          version="${TAG#v}"
          base="$PUBLIC_URL/launcher/$version"
          prefix="DungeonBlitzR-Launcher-$version"
          platforms=$(jq -n '{}')
          add() {
            local key="$1" file="$2" sig="dl/$2.sig"
            if [ -f "dl/$file" ] && [ -f "$sig" ]; then
              platforms=$(jq --arg k "$key" --arg url "$base/$file" --rawfile sig "$sig" \
                '.[$k] = {signature: $sig, url: $url}' <<<"$platforms")
              echo "updater: $key -> $file"
            else
              echo "updater: $key skipped (no signed $file)"
            fi
          }
          add windows-x86_64 "$prefix-win-x64-setup.exe"
          add windows-i686   "$prefix-win-ia32-setup.exe"
          add win7-x86_64    "$prefix-win7-x64-setup.exe"
          add win7-i686      "$prefix-win7-ia32-setup.exe"
          add linux-x86_64   "$prefix-linux-x86_64.AppImage"
          if [ "$(jq 'length' <<<"$platforms")" -eq 0 ]; then
            echo "::warning::No signed updater artifacts in $TAG; updater.json not written (this release stays download-only)."
            exit 0
          fi
          jq -n --arg v "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg notes "Dungeon Blitz: R launcher $version" --argjson platforms "$platforms" \
            '{version: $v, pub_date: $date, notes: $notes, platforms: $platforms}' > updater.json
          cat updater.json
          aws s3 cp updater.json "s3://$BUCKET/launcher/updater.json" --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "public, max-age=300"

      - name: Check the upload
        if: env.SKIP != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          # Ask the bucket, not the public URL: Cloudflare answers 403 to some GitHub runner IPs
          # (bot protection), which says nothing about whether players can download.
          aws s3api head-object --bucket "$BUCKET" --key launcher/latest.json --endpoint-url "$ENDPOINT" >/dev/null
          for name in $(jq -r '.assets[].name' latest.json); do
            aws s3api head-object --bucket "$BUCKET" --key "launcher/${TAG#v}/$name" --endpoint-url "$ENDPOINT" >/dev/null
          done
          echo "latest.json and $(jq '.assets | length' latest.json) installers are in the bucket."
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$PUBLIC_URL/launcher/latest.json" || true)
          echo "Public URL answered $code from this runner."
          if [ "$code" != "200" ]; then echo "::warning::$PUBLIC_URL answered $code from the runner; check it from a browser."; fi

      - name: Prune old launcher versions from R2
        # Runs only after the check above, so a failed upload never removes the previous version.
        if: env.SKIP != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          KEEP: "2"
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Version folders under launcher/, newest first. The version just published always stays,
          # and the newest $KEEP versions stay. latest.json and updater.json are files, not folders,
          # so they are never touched.
          mapfile -t versions < <(aws s3 ls "s3://$BUCKET/launcher/" --endpoint-url "$ENDPOINT" \
            | awk '$1 == "PRE" {print $2}' | tr -d / | sort -rV)
          if ! printf '%s\n' "${versions[@]}" | grep -qx "$version"; then
            echo "::error::$version is not in the bucket; refusing to prune."; exit 1
          fi
          kept=0
          for v in "${versions[@]}"; do
            if [ "$v" = "$version" ] || [ "$kept" -lt "$KEEP" ]; then
              kept=$((kept + 1)); echo "keep $v"; continue
            fi
            echo "delete launcher/$v/"
            aws s3 rm "s3://$BUCKET/launcher/$v/" --recursive --endpoint-url "$ENDPOINT"
          done
