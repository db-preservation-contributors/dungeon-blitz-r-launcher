name: Tests

# The Node checks the Rust launcher still relies on: the window's status rows (renderer/), the
# Linux Flash Player preload and the AIR engine bundle. The Rust side's own tests run in the
# Rust launcher workflow (cargo test). These need no npm packages, so nothing is installed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: Launcher test suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run test suites
        run: npm test
