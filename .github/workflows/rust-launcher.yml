name: Rust launcher

# Self-update signing (one-time setup, repo Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater private key (the `tauri signer generate` file's
#                                       contents; its public key is in src-tauri/tauri.conf.json).
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key's password, or empty if it has none.
# Without these the build still runs, just without the signatures the launcher's in-place updater
# needs, and publish-downloads.yml then leaves that release download-only.

on:
  push:
    branches: [main]
    paths: ['src-tauri/**', 'renderer/**', 'servers.json', '*.config.json', 'tools/win7-imports.js', 'tools/appimage-tools/**', 'tools/nsis-tools/**', 'tools/build-wine.js', 'tools/build-air.js', 'air/**', 'wine.lock.json', '.github/workflows/rust-launcher.yml']
  pull_request:
    paths: ['src-tauri/**', 'renderer/**', 'servers.json', '*.config.json', 'tools/win7-imports.js', 'tools/appimage-tools/**', 'tools/nsis-tools/**', 'tools/build-wine.js', 'tools/build-air.js', 'air/**', 'wine.lock.json', '.github/workflows/rust-launcher.yml']
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the installers to a DRAFT GitHub release (never published here)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  air-windows:
    # The Windows AIR bundle, built once: the Windows installer carries it, and so does Linux,
    # which plays it in Wine (HARMAN's Linux AIR runtime needs a commercial licence, and ADT
    # builds a bundle only for the system it runs on).
    name: AIR engine (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the AIR engine
        shell: bash
        run: |
          sdk=$(node tools/fetch-air-sdk.js --platform win32 | tail -1)
          AIR_SDK_HOME="$sdk" node tools/build-air.js

      - uses: actions/upload-artifact@v4
        with:
          name: air-win32
          path: |
            vendor/air/win32/
            lib/air.integrity.json
          if-no-files-found: error
          retention-days: 3

  build:
    name: ${{ matrix.label }}
    needs: [test, air-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # air: build -- this runner builds its own AIR bundle; windows -- it takes the one the
          # air-windows job built (Linux plays it in the Wine it builds, tools/build-wine.js).
          - { os: windows-latest, label: Windows x64, platform: win32, target: x86_64-pc-windows-msvc, toolchain: stable, air: windows, name: win-x64 }
          - { os: macos-15-intel, label: macOS, platform: darwin, target: x86_64-apple-darwin, toolchain: stable, air: build, name: mac-x64 }
          - { os: ubuntu-22.04, label: Linux, platform: linux, target: x86_64-unknown-linux-gnu, toolchain: stable, air: windows, name: linux }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev patchelf libgtk2.0-0 libnss3 squashfs-tools
          # Wine (tools/build-wine.js): its build tools and the libraries its drivers use.
          sudo apt-get install -y gcc-mingw-w64-x86-64 flex bison libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxcomposite-dev libxinerama-dev libxfixes-dev libxrender-dev libxxf86vm-dev \
            libfreetype-dev libfontconfig-dev libgnutls28-dev libpulse-dev libasound2-dev libgl-dev libegl-dev \
            libvulkan-dev libdbus-1-dev libudev-dev libwayland-dev wayland-protocols libxkbcommon-dev libxkbregistry-dev

      - name: Set up Rust (stable)
        if: matrix.toolchain == 'stable'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust (nightly, Windows 7 targets are built from source)
        if: matrix.toolchain == 'nightly'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: ${{ matrix.bundle_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Fetch Flash Player
        shell: bash
        run: node tools/fetch-projector.js --platform ${{ matrix.platform }}

      - name: Build the Flash Player preload
        if: matrix.platform == 'linux'
        shell: bash
        run: node tools/build-flash-preload.js --platform linux

      - name: Set up Java for the AIR SDK
        if: matrix.air == 'build'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the AIR engine
        if: matrix.air == 'build'
        shell: bash
        run: |
          sdk=$(node tools/fetch-air-sdk.js --platform ${{ matrix.platform }} | tail -1)
          AIR_SDK_HOME="$sdk" node tools/build-air.js

      - name: Take the Windows AIR engine
        if: matrix.air == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: air-win32
          path: .

      - name: Reuse a Wine build
        if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: |
            build/wine/install
            build/wine/install.stamp.json
          key: wine-${{ runner.os }}-${{ hashFiles('wine.lock.json', 'tools/build-wine.js') }}

      - name: Build Wine
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          node tools/build-wine.js
          node tools/build-air.js --check vendor/air/win32/DungeonBlitzR --platform win32

      - name: Check the game engine
        shell: bash
        run: |
          arch=x64
          case "${{ matrix.target }}" in i686-*) arch=ia32 ;; esac
          # Linux carries both: Flash Player (checked here) and the Windows AIR bundle in Wine
          # (checked in "Build Wine").
          engine=air; [ "${{ matrix.platform }}" = linux ] && engine=flash
          node tools/preflight.js --platform ${{ matrix.platform }} --arch $arch --engine $engine

      - name: Seed the AppImage build tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # Tauri downloads AppRun and linuxdeploy from GitHub release assets while bundling the
          # AppImage; those downloads 504 whenever GitHub is degraded and fail the Linux build. The
          # tools are vendored in tools/appimage-tools and copied into Tauri's tool cache under the
          # exact names tauri-bundler looks for (~/.cache/tauri/AppRun-x86_64 and
          # linuxdeploy-07333c6-x86_64.AppImage), so the bundler finds them and never downloads.
          cache="$HOME/.cache/tauri"
          mkdir -p "$cache"
          # linuxdeploy lives in Git LFS and checkout runs with LFS off, so materialize it here.
          git lfs pull --include="tools/appimage-tools/*.AppImage" || true
          seed() { # <cache file name> <vendored path> <fallback download url>
            local dst="$cache/$1"
            if [ -f "$2" ] && [ "$(stat -c%s "$2")" -gt 1000 ]; then
              cp "$2" "$dst"
            else
              echo "::warning::$2 is missing or an unresolved LFS pointer; downloading $1 with retries."
              curl -fSL --retry 8 --retry-all-errors --retry-delay 5 --max-time 300 -o "$dst" "$3"
            fi
            chmod +x "$dst"
            test "$(stat -c%s "$dst")" -gt 1000
          }
          seed AppRun-x86_64 tools/appimage-tools/AppRun-x86_64 \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64"
          seed linuxdeploy-07333c6-x86_64.AppImage tools/appimage-tools/linuxdeploy-07333c6-x86_64.AppImage \
            "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage"
          ls -la "$cache"

      - name: Seed the NSIS build tools
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The Windows twin of the AppImage step: when %LOCALAPPDATA%\tauri\NSIS is absent,
          # tauri-bundler downloads nsis-3.13.zip and nsis_tauri_utils.dll from GitHub release assets,
          # and those 503/504 whenever GitHub is degraded (every Windows job of the v1.12.1 rerun).
          # The pinned files are vendored in tools/nsis-tools and laid out exactly as the bundler
          # would (crates/tauri-bundler/src/bundle/windows/nsis/mod.rs): with every required file
          # present and NSIS.exe at the expected SHA1, it skips the downloads. A newer Tauri CLI that
          # pins other versions just sees an outdated NSIS.exe and downloads, as before this step.
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $tools 'NSIS'
          New-Item -ItemType Directory -Force $tools | Out-Null
          function Get-Tool([string]$vendored, [string]$url, [string]$sha1) {
            if ((Test-Path $vendored) -and (Get-FileHash $vendored -Algorithm SHA1).Hash -eq $sha1) {
              return (Resolve-Path $vendored).Path
            }
            Write-Host "::warning::$vendored is missing or not SHA1 $sha1; downloading it with retries."
            $out = Join-Path $env:RUNNER_TEMP (Split-Path $url -Leaf)
            for ($i = 1; ; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $out -TimeoutSec 300
                if ((Get-FileHash $out -Algorithm SHA1).Hash -ne $sha1) { throw "SHA1 mismatch for $url" }
                return $out
              } catch {
                if ($i -ge 8) { throw }
                Write-Host "Attempt $i failed: $_"
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }
          $zip = Get-Tool 'tools/nsis-tools/nsis-3.13.zip' `
            'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' `
            'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E'
          $dll = Get-Tool 'tools/nsis-tools/nsis_tauri_utils.dll' `
            'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' `
            '75197FEE3C6A814FE035788D1C34EAD39349B860'
          if (Test-Path $nsis) { Remove-Item -Recurse -Force $nsis }
          Expand-Archive -Path $zip -DestinationPath $tools
          Rename-Item (Join-Path $tools 'nsis-3.13') 'NSIS'
          $plugins = Join-Path $nsis 'Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Copy-Item $dll (Join-Path $plugins 'nsis_tauri_utils.dll')
          Get-FileHash (Join-Path $nsis 'NSIS.exe'), (Join-Path $plugins 'nsis_tauri_utils.dll') -Algorithm SHA1 |
            Format-Table Hash, Path -AutoSize

      - name: Build installers
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
          NO_STRIP: true
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p vendor
          # createUpdaterArtifacts (tauri.conf.json) makes the bundler sign at build time, which
          # needs the key. Before the secret is set -- or on a build that cannot sign -- turn it
          # off so the build still succeeds; the signatures the updater actually uses are made
          # after bundling, in "Sign the updater artifacts", over the final published files.
          updater_cfg=""
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            updater_cfg='--config {"bundle":{"createUpdaterArtifacts":false}}'
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater signatures."
          fi
          if [ "${{ matrix.win7 }}" = "true" ]; then
            # Tier-3 targets are not in `rustup target list`, which the Tauri CLI checks, so the
            # binary is built with cargo and bundled as the matching regular Windows target.
            (cd src-tauri && cargo fetch --locked)
            arch=x86_64; case "${{ matrix.target }}" in i686-*) arch=i686 ;; esac
            for d in "$CARGO_HOME"/registry/src/*/windows_${arch}_msvc-*/lib; do RUSTFLAGS="$RUSTFLAGS -L native=$(cygpath -m "$d")"; done
            # windows_slim_errors: no RoOriginateErrorW (api-ms-win-core-winrt-error, Windows 8+).
            # crt-static: no api-ms-win-crt-*.dll, which Windows 7 has only with the UCRT update.
            RUSTFLAGS="$RUSTFLAGS --cfg windows_slim_errors -C target-feature=+crt-static"
            export RUSTFLAGS
            (cd src-tauri && cargo build --release --locked --target ${{ matrix.target }} --features win7,custom-protocol -Zbuild-std=std,panic_abort)
            mkdir -p src-tauri/target/${{ matrix.bundle_target }}/release
            cp src-tauri/target/${{ matrix.target }}/release/dungeon-blitz-r-launcher.exe src-tauri/target/${{ matrix.bundle_target }}/release/
            # combase.dll (Windows 8+) -> ole32.dll, then refuse any import Windows 7 lacks.
            node tools/win7-imports.js src-tauri/target/${{ matrix.bundle_target }}/release/dungeon-blitz-r-launcher.exe
            npx --yes @tauri-apps/cli@2 bundle --target ${{ matrix.bundle_target }} --bundles nsis
          else
            npx --yes @tauri-apps/cli@2 build --verbose --target ${{ matrix.target }}
          fi

      - name: Name the installers
        shell: bash
        run: |
          # The Rust launcher has its own version (src-tauri/tauri.conf.json). package.json stays
          # the Electron launcher's: bumping it on main starts the Electron Release workflow.
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle=src-tauri/target/${{ matrix.bundle_target || matrix.target }}/release/bundle
          out=dist-rs
          mkdir -p $out
          prefix="DungeonBlitzR-Launcher-$version"
          case "${{ matrix.name }}" in
            win*) cp "$(ls $bundle/nsis/*-setup.exe | head -1)" "$out/$prefix-${{ matrix.name }}-setup.exe" ;;
            mac-x64)
              tools/mac-vendor.sh "$(ls -d $bundle/macos/*.app | head -1)" "$PWD/$out/$prefix-mac-x64.dmg" ;;
            linux)
              # linuxdeploy patches flashplayer and the preload libraries inside the AppImage, so
              # the launcher's fingerprint check refused them (1.12.0). Put the originals back.
              tools/appimage-vendor.sh "$(ls $bundle/appimage/*.AppImage | head -1)" "$out/$prefix-linux-x86_64.AppImage"
              deb="$(ls $bundle/deb/*.deb | head -1)"
              check=$(mktemp -d) && dpkg-deb -x "$deb" "$check"
              vendor="$check/usr/lib/$(node -p "require('./src-tauri/tauri.conf.json').productName")/vendor"
              node tools/verify-projector.js "$vendor/projector/linux/flashplayer" --platform linux
              node tools/build-flash-preload.js --check "$vendor/flashpreload/linux"
              node tools/build-air.js --check "$vendor/air/win32/DungeonBlitzR" --platform win32
              node tools/build-wine.js --check "$vendor/wine/linux/wine"
              cp "$deb" "$out/$prefix-linux-amd64.deb" ;;
          esac
          ls -la $out

      - name: Sign the updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The launcher updates itself only from the NSIS setups and the AppImage (update.rs
          # self_updatable()); the .dmg and .deb stay download-only, so they are not signed. Sign
          # the final renamed files, after appimage-vendor.sh has patched the AppImage, so the
          # signature matches the exact bytes publish-downloads.yml puts in updater.json.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; no updater signatures were written."
            exit 0
          fi
          shopt -s nullglob
          signed=0
          for f in dist-rs/*-setup.exe dist-rs/*.AppImage; do
            npx --yes @tauri-apps/cli@2 signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$f"
            test -f "$f.sig"
            signed=$((signed + 1))
          done
          echo "Signed $signed updater artifact(s)."
          ls -la dist-rs

      - uses: actions/upload-artifact@v4
        with:
          name: rust-launcher-${{ matrix.name }}
          path: dist-rs/*
          if-no-files-found: error
          # The draft release copies these within the run; keeping them longer only fills the
          # repo's artifact storage, and a full store makes every upload fail.
          retention-days: 3

  release:
    # One draft release with every build's installers. Nothing here publishes it: a person
    # reads it and presses Publish. The tag is v<tauri.conf.json version>, which starts at
    # 1.12.0 so it never meets an Electron tag (1.11.x). update.rs finds a new version through
    # GitHub's latest release and picks the installer by the names "Name the installers" gives.
    name: Draft release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          pattern: rust-launcher-*
          path: dist-rs
          merge-multiple: true

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          ls -la dist-rs
          for name in mac-x64.dmg win-x64-setup.exe linux-x86_64.AppImage linux-amd64.deb; do
            test -f "dist-rs/DungeonBlitzR-Launcher-$version-$name" || { echo "::error::missing DungeonBlitzR-Launcher-$version-$name"; exit 1; }
          done
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then
            echo "::error::$tag is already published. Raise the version in src-tauri/tauri.conf.json."
            exit 1
          fi
          notes="Dungeon Blitz: R launcher $version, the Rust launcher. Built from $GITHUB_SHA by run $GITHUB_RUN_ID.

          - macOS: DungeonBlitzR-Launcher-$version-mac-x64.dmg
          - Windows 10/11: win-x64-setup.exe
          - Linux: linux-x86_64.AppImage or linux-amd64.deb"
          if [ "$state" = "true" ]; then
            echo "Draft $tag exists; replacing its installers."
            gh release upload "$tag" dist-rs/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --draft --target "$GITHUB_SHA" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist-rs/* --draft --target "$GITHUB_SHA" \
              --title "$version (Rust launcher)" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '{isDraft, assets: [.assets[].name]}'
