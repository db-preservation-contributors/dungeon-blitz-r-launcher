name: Release

# Bumping the version in package.json publishes the installers: a .exe for Windows, a .dmg
# for macOS, and AppImage/deb for Linux, attached to a GitHub release.
#
# Each platform is built on its own runner. Cross-building is not an option: the Windows
# installer needs Windows, the .dmg needs macOS, and the native Discord Social SDK bridge
# has to be compiled per platform.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installers to a release"
        type: boolean
        default: false
      prerelease:
        description: "Publish it as a pre-release (needs publish). Auto-update never offers a pre-release."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check.outputs.current }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The previous commit is needed to tell a version bump from any other edit.
          fetch-depth: 2
          # Nothing here reads a binary, and every build job pulls LFS itself.
          lfs: false

      - name: Compare versions
        id: check
        run: |
          current=$(jq -r .version package.json)
          previous=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version || echo "")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          # A manual run is a deliberate "build this version": it is how the first release
          # gets out, and how a failed build is retried without a fake bump.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run; building $current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$current" = "$previous" ]; then
            echo "Version is still $current; nothing to build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version went from ${previous:-none} to $current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.label }}
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_fail == true }}
    strategy:
      # One platform failing should not hide whether the others are shippable.
      fail-fast: false
      matrix:
        include:
          # Windows x64. ia32 is a separate entry below, not a second architecture in this
          # one: electron-builder emits a universal installer whenever a single run
          # packages more than one architecture, and that universal is what latest.yml
          # points at, so every updating player downloads both arches. One run, one arch.
          - os: windows-latest
            platform: win32
            arch: x64
            label: Windows x64
            # `nsis:x64` / `portable:x64` rather than the --x64 flag: the flag only decides
            # which arches are requested, and `build.win` still lists x64, so asking for ia32
            # produced BOTH (plus the universal) instead of replacing it.
            builder_args: --win nsis:x64 portable:x64
            publish_mode: always
          # The 32-bit installers. They play: the game runs in flashplayer_32_sa.exe, a
          # 32-bit program in its own process. They never publish an update manifest --
          # see "Drop the ia32 update manifest" below.
          - os: windows-latest
            platform: win32
            arch: ia32
            label: Windows ia32
            # The per-target `name:arch` suffix is what pins this run to ia32 alone.
            builder_args: --win nsis:ia32 portable:ia32
            publish_mode: never
          # An Intel runner: the package is x64 (Apple Silicon runs it, and Flash Player, which
          # is Intel-only, under Rosetta). macos-13 was retired, and a retired label does not
          # fail -- the job simply queues forever.
          - os: macos-15-intel
            platform: darwin
            label: macOS
            builder_args: --mac
            publish_mode: always
          # Linux is allowed to fail so that one platform cannot stop the Windows and macOS
          # installers from publishing; a failure is still visible on the run page.
          - os: ubuntu-22.04
            platform: linux
            label: Linux
            builder_args: --linux
            publish_mode: always
            allow_fail: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # payload/ holds the prebuilt Discord bridges and FlashBrowser's Flash plugin.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        # The Social SDK links against ALSA and PulseAudio.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev

      - name: Build Discord Social SDK bridge
        shell: bash
        # The SDK is not redistributable, so it is not in this repository. When a job
        # supplies it the bridge is rebuilt from source; otherwise the prebuilt binary in
        # payload/social/<platform>/ is used as-is.
        run: |
          if [ ! -d native_bridge/discord_social_sdk ]; then
            echo "Social SDK not present; using the prebuilt bridge from payload/."
            exit 0
          fi
          cmake -S native_bridge -B native_bridge/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native_bridge/build --config Release

      - name: Stage vendor binaries
        shell: bash
        run: node tools/stage-vendor.js --platform ${{ matrix.platform }} --bridge-build native_bridge/build

      - name: Fetch Flash Player
        shell: bash
        # Adobe's standalone Flash Player (flashplayer_32_sa) is the game engine. It is not
        # in the repository: it is downloaded from Adobe's update server (the Internet
        # Archive's copy as the fallback) and checked against projector.lock.json.
        run: node tools/fetch-projector.js --platform ${{ matrix.platform }}

      - name: Build the Flash Player preload
        shell: bash
        # Linux only: native_flash/ compiled into vendor/flashpreload/linux/, the libraries the
        # launcher loads into Flash Player, and fingerprinted into the app. Other platforms
        # have nothing to build.
        run: node tools/build-flash-preload.js --platform ${{ matrix.platform }}

      - name: Fetch FlashBrowser
        shell: bash
        # The default engine: Electron 11 (checked against flashbrowser.lock.json), the
        # game-window app in flashbrowser/ and the Flash plugin from payload/flash/. Windows
        # x64 and macOS only; the ia32 and Linux runs clear it and play in Flash Player alone.
        run: node tools/fetch-flash-browser.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch || 'x64' }}

      - name: Install dependencies
        run: npm ci

      - name: Check Flash Player
        shell: bash
        # --arch matters for Windows: the two runs package different architectures, so the
        # check has to be against the one this entry builds. Same reason the local
        # npm run dist:win / dist:win:ia32 pair each run their own predist hook.
        run: node tools/preflight.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch || 'x64' }}

      - name: Build installers
        # --publish always uploads the installers AND the latest*.yml metadata the
        # launcher's auto-updater reads; without those files an installed launcher can
        # never see a new release. It still needs the release job below to publish the
        # draft: GitHub's update provider cannot see a draft release.
        #
        # --publish never on the ia32 run, and its manifest is deleted below. electron-builder
        # names the Windows update manifest `latest.yml` for EVERY architecture -- the
        # per-arch suffix it uses on Linux is not applied to Windows -- so both runs
        # write the same filename and whichever finishes last owns it. An ia32 manifest
        # would point every updating x64 player at a 32-bit installer that cannot play.
        run: npx electron-builder ${{ matrix.builder_args }} --publish ${{ matrix.publish_mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds. Signing needs the studio's certificates: CSC_LINK /
          # CSC_KEY_PASSWORD for both Windows and macOS, plus APPLE_ID,
          # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID for notarization. Signing is
          # also what makes macOS auto-update work: an unsigned macOS build cannot be
          # self-updated, so those players update by downloading the new .dmg by hand.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Drop the ia32 update manifest
        # Only x64 has one, and it must be the only `latest.yml` in the release. Deleting
        # it here rather than in the upload path keeps this a build-time decision, so the
        # "List what was built" step below shows what was actually kept.
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "ia32" ]; then
            echo "Removing the ia32 run's latest.yml; only x64 ships an update manifest."
            ls -la dist/latest*.yml || echo "(this run produced no update manifest)"
            rm -f dist/latest.yml dist/latest-ia32.yml
          fi

      - name: Check Flash Player and FlashBrowser made it into the package
        shell: bash
        # The installers are only worth shipping if the engines inside them, and on Linux what
        # is loaded into Flash Player, are intact: each fingerprint must match the one packed
        # into the app (the check an installed launcher runs before every game), and on macOS
        # Adobe's signature must still verify.
        run: |
          case "${{ matrix.platform }}" in
            darwin)
              app=$(find dist -maxdepth 8 -path '*.app/Contents/Resources/vendor/projector/darwin/Flash Player.app' | head -1)
              test -n "$app" || { echo "Flash Player.app is missing from the package"; exit 1; }
              codesign --verify --deep --strict --verbose=2 "$app"
              node tools/verify-projector.js "$app" --platform darwin
              browser=$(find dist -maxdepth 8 -type d -path '*.app/Contents/Resources/vendor/flashbrowser/darwin-x64' | head -1)
              test -n "$browser" || { echo "FlashBrowser is missing from the package"; exit 1; }
              node tools/verify-flash-browser.js "$browser" --target darwin-x64 || {
                echo "What differs between vendor/ and the package (< vendor, > package):"
                diff <(node tools/verify-flash-browser.js vendor/flashbrowser/darwin-x64 --list) \
                     <(node tools/verify-flash-browser.js "$browser" --list) | head -60 || true
                exit 1
              }
              ;;
            win32)
              found=$(find dist -path '*unpacked*/resources/vendor/projector/win32/flashplayer_32_sa.exe' | head -1)
              test -n "$found" || { echo "flashplayer_32_sa.exe is missing from the package"; exit 1; }
              node tools/verify-projector.js "$found" --platform win32
              browser=$(find dist -type d -path '*unpacked*/resources/vendor/flashbrowser/win32-*' | head -1)
              if [ "${{ matrix.arch }}" = "x64" ]; then
                test -n "$browser" || { echo "FlashBrowser is missing from the package"; exit 1; }
                node tools/verify-flash-browser.js "$browser" --target win32-x64 || {
                  echo "What differs between vendor/ and the package (< vendor, > package):"
                  diff <(node tools/verify-flash-browser.js vendor/flashbrowser/win32-x64 --list) \
                       <(node tools/verify-flash-browser.js "$browser" --list) | head -60 || true
                  exit 1
                }
              else
                test -z "$browser" || { echo "the ia32 package must not carry the x64 FlashBrowser ($browser)"; exit 1; }
              fi
              ;;
            linux)
              found=$(find dist -path '*unpacked/resources/vendor/projector/linux/flashplayer' | head -1)
              test -n "$found" || { echo "flashplayer is missing from the package"; exit 1; }
              test -x "$found" || { echo "flashplayer is not executable in the package"; exit 1; }
              node tools/verify-projector.js "$found" --platform linux
              preload=$(find dist -type d -path '*unpacked/resources/vendor/flashpreload/linux' | head -1)
              test -n "$preload" || { echo "the Flash Player preload is missing from the package"; exit 1; }
              node tools/build-flash-preload.js --check "$preload"
              ;;
          esac

      - name: Start the packaged launcher
        if: matrix.platform != 'linux'
        shell: bash
        # The finished launcher has to start. 1.2.2 passed every check above and still died within a
        # second on every Windows and macOS machine: the installed launcher's Electron fuses kill
        # the process for things a development run never does. This starts the unpacked package as
        # built and fails if it exits or logs a FATAL line. (Linux has no asar integrity fuse.)
        run: |
          case "${{ matrix.platform }}" in
            darwin) exe="$(find dist -maxdepth 5 -path '*.app/Contents/MacOS/Dungeon Blitz R' | head -1)" ;;
            win32) exe="$(find dist -maxdepth 2 -path '*unpacked/Dungeon Blitz R.exe' | head -1)" ;;
          esac
          test -n "$exe" || { echo "the packaged launcher is missing"; exit 1; }
          node tools/smoke-launch.js "$exe" --seconds 20

      - name: Mark the draft release as not to be published
        # electron-builder has already uploaded this job's installers to the draft. A draft from a
        # failed run looks like any other, and 1.2.2 was published from one, so say so on it. A
        # later run that succeeds sets the release's name and notes again when it publishes.
        if: failure() && matrix.publish_mode == 'always'
        shell: bash
        run: |
          version=$(jq -r .version package.json)
          gh release edit "v$version" --repo "$GITHUB_REPOSITORY" \
            --title "v$version - DO NOT PUBLISH (the ${{ matrix.label }} build failed)" \
            --notes "The ${{ matrix.label }} build of this release failed. Its installers here may be broken. Fix the build and run the Release workflow again; do not publish this draft." \
            || echo "No draft release to mark."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List what was built
        shell: bash
        run: ls -la dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/latest*.yml 2>/dev/null || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          # Per architecture, not per platform: both Windows jobs produce win32 files, and
          # two jobs uploading the same artifact name makes the second one fail.
          name: launcher-${{ matrix.platform }}-${{ matrix.arch || 'default' }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml

  release:
    name: Publish release
    needs: [version, build]
    # A manual run only publishes when asked; a real version bump always does.
    if: needs.version.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.current }}
          name: Launcher v${{ needs.version.outputs.current }}
          # The tag goes on the commit that was built, which for a manual run from a branch
          # is not the default branch's head.
          target_commitish: ${{ github.sha }}
          # Put before the generated notes. Launchers on Windows 7/8 (1.1.0 and earlier) still
          # download every release, and the setup installer refuses to run there
          # (build/installer.nsh). This line is for the player who checks the releases page.
          body: |
            **Windows:** needs Windows 10 or later. On Windows 7, 8 or 8.1, keep using launcher 1.1.0. The installer will not run there and leaves the installed launcher as it is.
          generate_release_notes: true
          # Left as a draft so the unsigned builds get a look before players see them.
          # electron-builder has already uploaded the artifacts and the latest*.yml update
          # metadata to this draft; PUBLISHING the draft (one click, or the API) is what
          # makes the auto-updater see it -- a draft release is invisible to the feed.
          #
          # Always a draft here, even for a pre-release: electron-builder has already made a
          # draft for this tag, and asking this action for a published release creates a
          # second release that takes the tag, after which the draft holding the installers
          # can no longer be published (1.0.17's first attempt). The step below publishes.
          draft: true
          files: installers/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish as a pre-release
        # A manual run with `prerelease`: downloadable from the releases page, but never
        # offered by auto-update, which only follows GitHub's "latest" release and that
        # excludes pre-releases.
        if: github.event_name == 'workflow_dispatch' && inputs.prerelease
        run: |
          gh release edit "v${{ needs.version.outputs.current }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
