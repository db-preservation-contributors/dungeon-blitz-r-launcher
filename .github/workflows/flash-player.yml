name: Flash Player

# Proves that every platform's standalone Flash Player (flashplayer_32_sa) can still be
# fetched and unpacked, and that the bytes match projector.lock.json. Releases fetch it
# the same way; this catches a dead mirror before a release does.

on:
  push:
    paths:
      - "projector.lock.json"
      - "tools/fetch-projector.js"
      - "lib/projector.js"
      - "lib/loaderSwf.js"
      - "lib/windowTitle.js"
      - "tools/check-window-title.js"
      - ".github/workflows/flash-player.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, label: Windows }
          - { os: macos-15-intel, platform: darwin, label: macOS }
          - { os: ubuntu-22.04, platform: linux, label: Linux }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and unpack
        shell: bash
        run: node tools/fetch-projector.js --platform ${{ matrix.platform }}

      - name: What was unpacked
        shell: bash
        run: |
          find vendor/projector -maxdepth 4 | head -50
          file vendor/projector/${{ matrix.platform }}/* 2>/dev/null || true

      - name: Adobe's signature on the Windows player
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature vendor/projector/win32/flashplayer_32_sa.exe
          $signature | Format-List Status, SignerCertificate
          (Get-Item vendor/projector/win32/flashplayer_32_sa.exe).VersionInfo | Format-List FileVersion, CompanyName

      - name: Adobe's signature on the macOS player
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          codesign --verify --deep --verbose=2 "vendor/projector/darwin/Flash Player.app" || true
          codesign -dvv "vendor/projector/darwin/Flash Player.app" 2>&1 | grep -E 'Authority|Identifier|TeamIdentifier' || true
          lipo -info "vendor/projector/darwin/Flash Player.app/Contents/MacOS/"* || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "vendor/projector/darwin/Flash Player.app/Contents/Info.plist"

      - name: 'The game window reads "Dungeon Blitz: R"'
        if: matrix.platform != 'linux'
        shell: bash
        run: node tools/check-window-title.js
