name: FlashBrowser

# Proves that FlashBrowser -- the second, smoother game engine: Electron 11, the game-window app in
# flashbrowser/ and FlashBrowser's Flash plugin from payload/flash/ -- can still be assembled
# for each platform that has one, that its bytes match flashbrowser.lock.json, and that the
# plugin really loads: a page in it has to get a SWF running in Flash. Releases assemble it the
# same way; this catches a dead mirror or a broken plugin before a release does.

on:
  push:
    paths:
      - "flashbrowser.lock.json"
      - "flashbrowser/**"
      - "payload/flash/**"
      - "lib/flashBrowser.js"
      - "lib/integrity.js"
      - "tools/fetch-flash-browser.js"
      - "tools/check-flash-browser.js"
      - "tools/verify-flash-browser.js"
      - ".github/workflows/flash-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64, target: win32-x64, label: Windows x64 }
          - { os: macos-15-intel, platform: darwin, arch: x64, target: darwin-x64, label: macOS }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The plugin is in payload/flash/, through Git LFS.
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble
        shell: bash
        run: node tools/fetch-flash-browser.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Matches its fingerprint
        shell: bash
        run: node tools/verify-flash-browser.js vendor/flashbrowser/${{ matrix.target }} --target ${{ matrix.target }}

      - name: What was assembled
        shell: bash
        run: |
          ls -la vendor/flashbrowser/${{ matrix.target }} vendor/flashbrowser/${{ matrix.target }}/app vendor/flashbrowser/${{ matrix.target }}/plugin
          cat lib/flashbrowser.integrity.json

      - name: Flash runs a movie in the game window
        shell: bash
        run: node tools/check-flash-browser.js
