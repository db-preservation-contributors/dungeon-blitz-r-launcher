<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
  <title>Dungeon Blitz: R</title>
  <!-- Fonts and artwork are the ones theminesa.studio/dungeon-blitz-r.html uses, vendored
       locally: the window has to look like the site without reaching the network. -->
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
  <div class="db-hero__backdrop" aria-hidden="true"></div>
  <div class="db-hero__vignette" aria-hidden="true"></div>
  <div class="db-hero__grain" aria-hidden="true"></div>

  <main class="db-page">
    <header class="db-header">
      <span class="db-logo">
        <img src="assets/logo.svg" alt="Dungeon Blitz R">
      </span>
      <nav class="db-nav" aria-label="Sections">
        <span class="db-nav__link db-nav__link--active">Launcher</span>
      </nav>
      <span class="db-version" id="versions"></span>
    </header>

    <section class="db-copy">
      <img class="db-copy__ornament" src="assets/ornament.svg" alt="">
      <h1>Dungeon Blitz<span class="mark">: R</span></h1>
      <p class="db-copy__lead">Side-scrolling brawler</p>
      <p id="status" class="db-copy__status"></p>
    </section>

    <section class="db-actions">
      <button id="discord-login" type="button" class="db-launch">
        <span class="label">Sign in with Discord</span>
      </button>
      <!-- While a sign-in waits on the browser: the same link, for a browser that did not open
           or a player who would rather paste it into another one. -->
      <button id="copy-login" type="button" class="link quiet" hidden>Browser didn't open? Copy the sign-in link</button>

      <!-- When the launcher and the browser reach the server from different addresses, the
           server asks for the code its "login successful" page shows before it signs this
           launcher in. -->
      <div id="login-code" class="login-code" hidden>
        <label for="login-code-input">Enter the code your browser shows</label>
        <div class="login-code__row">
          <input id="login-code-input" type="text" maxlength="9" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX">
          <button id="login-code-submit" type="button" class="ghost">Confirm</button>
        </div>
        <span id="login-code-error" class="login-code__error" hidden>Wrong code. Check your browser and try again.</span>
      </div>
      <!-- The play button: the game in the build's engine -- Adobe AIR, or the standalone Flash
           Player in the builds AIR has no runtime for. -->
      <button id="play" type="button" class="db-play">Open the game</button>
      <button id="play-legacy" type="button" class="db-play-alt" hidden>Legacy</button>

      <!-- Signing in is a one-time thing: once an account is known the button is replaced by
           it, whether the sign-in happened here or inside the game. -->
      <div id="account" class="account" hidden>
        <div class="account-row">
          <span id="account-name" class="account-name"></span>
          <button id="account-reveal" type="button" class="account-reveal" title="Show email" hidden>&#128065;</button>
        </div>
        <button id="forget" type="button" class="link quiet">Use a different account</button>
      </div>
    </section>

    <p id="problem" class="problem" hidden></p>

    <div id="repair" class="repair" hidden>
      <button id="browse-flash" type="button" class="ghost">Choose Flash Player...</button>
      <button id="relaunch" type="button" class="ghost" hidden>Restart launcher</button>
      <button id="move-app" type="button" class="ghost" hidden>Move to Applications</button>
    </div>

    <!-- What a player cares about: rich presence, lobby chat, the widget profile and the
         version. Faults with Flash Player or the machine go in the problem banner above. -->
    <dl id="engine-status" class="engine-status"></dl>

    <!-- The update's own action, under the Version row: restart into a downloaded update, or
         download one this build cannot install itself. Not in the repair row, which only
         shows beside a problem. -->
    <div id="update-actions" class="tools" hidden>
      <button id="update-install" type="button" class="ghost" hidden>Restart to update</button>
      <button id="update-download" type="button" class="ghost" hidden>Download</button>
    </div>

    <details id="graphics" class="graphics">
      <summary>Graphics</summary>
      <div class="graphics__row">
        <label for="graphics-renderer">Renderer</label>
        <select id="graphics-renderer">
          <option value="auto">Auto</option>
          <option value="gpu">GPU</option>
          <option value="cpu">CPU</option>
        </select>
      </div>
      <div class="graphics__row">
        <label for="graphics-quality">Quality</label>
        <select id="graphics-quality">
          <option value="auto">Auto</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <p id="graphics-note" class="graphics__note"></p>
    </details>

    <details id="settings" class="graphics">
      <summary>Settings</summary>
      <label class="graphics__row settings__toggle" for="dev-mode">
        <span>Developer mode</span>
        <input id="dev-mode" type="checkbox">
      </label>
      <p class="graphics__note">Create and join test servers. Players do not need it.</p>
    </details>

    <!-- Developer mode: a test server from a game server checkout, behind two Cloudflare quick
         tunnels (Create), and playing one in AIR from its shared address (Join). -->
    <details id="developer" class="graphics developer" open hidden>
      <summary>Developer</summary>
      <div class="developer__group">
        <span class="developer__label">Create a server</span>
        <span id="dev-root" class="developer__path"></span>
        <div class="developer__row">
          <button id="dev-choose" type="button" class="ghost">Choose folder...</button>
          <button id="dev-create" type="button" class="ghost">Create server</button>
          <button id="dev-stop" type="button" class="ghost" hidden>Stop</button>
        </div>
        <span id="dev-server-status" class="developer__status"></span>
        <div id="dev-share" class="developer__row" hidden>
          <input id="dev-share-url" type="text" readonly>
          <button id="dev-copy" type="button" class="ghost">Copy</button>
        </div>
        <button id="dev-play-own" type="button" class="db-play-alt" hidden>Play on my server</button>
      </div>
      <div class="developer__group">
        <label class="developer__label" for="dev-join-address">Join a server</label>
        <div class="developer__row">
          <input id="dev-join-address" type="text" spellcheck="false" autocomplete="off" placeholder="https://....trycloudflare.com/web">
          <button id="dev-join" type="button" class="ghost">Join</button>
        </div>
        <span id="dev-join-status" class="developer__status"></span>
      </div>
    </details>

    <div id="tools" class="tools">
      <!-- The damage meter opens in a window of its own, to keep beside the game. -->
      <button id="damage-meter-open" type="button" class="ghost" hidden>Damage meter</button>
      <button id="game-stats-sync" type="button" class="ghost" hidden>Sync game stats</button>
    </div>
  </main>

  <footer class="db-footer">
    <div class="db-credit">
      <div class="db-credit__icons">
        <img src="assets/rocking.svg" alt="">
        <img src="assets/eye.svg" alt="">
      </div>
      <p>Remake by</p>
      <strong>The Minesa Studios</strong>
    </div>
    <button id="quit" type="button" class="link">Quit</button>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
